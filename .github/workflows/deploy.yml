name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 104.156.255.54 >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh daniel@104.156.255.54 << 'EOF'
            cd /home/daniel/portfolio
            git pull origin main
            npm install
            npm run build
            sudo systemctl restart nginx
          EOF

